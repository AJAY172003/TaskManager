version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskmanager-db
    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: taskmanager-api
    ports:
      - "8080:8080"
    environment:
      DB_USER: postgres
      DB_PASS: postgres
      JWT_SECRET: c2VjcmV0a2V5Zm9ydGFza21hbmFnZXJhcHBsaWNhdGlvbjIwMjQ=
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskmanager
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: taskmanager-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    depends_on:
      - backend

volumes:
  pgdata:
